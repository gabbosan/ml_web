name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Node version (if available)
        run: |
          node --version || echo "Node not installed"

      - name: List repository files
        run: |
          ls -la
